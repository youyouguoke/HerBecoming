name = "herbecoming"
compatibility_date = "2025-08-20"
pages_build_output_dir = ".vercel/output/static"

# Environment variables for Pages (public vars used by the static export)
# Static export uses same-origin /api/* proxy (Pages Functions), so leave API URL empty.
[env.production.vars]
NEXT_PUBLIC_API_URL = ""

# Pages only supports "production" and "preview" named environments.
# [env.staging.vars]
# NEXT_PUBLIC_API_URL = "https://api-staging.herbecoming.app"
