<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HerBecoming - Welcome</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "surface-container-high": "#ebe8e2",

                        "error-container": "#ffdad6",

                        "on-secondary": "#ffffff",

                        "on-error-container": "#93000a",

                        "surface-bright": "#fdf9f3",
                        "outline": "#847371",
                        "secondary-fixed": "#ffdad3",
                        "outline-variant": "#d6c2bf",
                        "tertiary": "#695c56",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#f6b7af",
                        "tertiary-fixed-dim": "#d4c3bc",
                        "tertiary-fixed": "#f1dfd7",
                        "on-surface-variant": "#514442",
                        "surface-dim": "#dddad4",
                        "on-tertiary-fixed": "#231a15",
                        "on-surface": "#1c1c18",
                        "inverse-primary": "#f6b7af",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#c98f88",
                        "on-background": "#1c1c18",
                        "on-tertiary-fixed-variant": "#50443f",
                        "on-secondary-container": "#794135",
                        "secondary": "#8a4e41",
                        "on-tertiary-container": "#3d322d",
                        "surface": "#fdf9f3",
                        "surface-container-highest": "#e6e2dc",
                        "surface-tint": "#82524c",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "xl": "80px",

                        "unit": "8px",

                    },
                    "fontFamily": {
                        "body-lg": ["DM Sans"],
                        "label-sm": ["DM Sans"],

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .composer-focus:focus-within {
            border-color: theme('colors.secondary-container');
            box-shadow: 0 4px 24px rgba(130, 82, 76, 0.08);
        }
        
        .fade-in {
            animation: fadeIn 1.2s ease-out forwards;
            opacity: 0;
        }
        
        .slide-up {
            animation: slideUp 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }
    </style>
</head>
<body class="font-body-md text-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background docked full-width top-0 flat no shadows z-40">
<div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-md max-w-[1140px] mx-auto">
<!-- Brand -->
<div class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim">
                HerBecoming
            </div>
<!-- Actions -->
<div class="hidden md:flex items-center space-x-gutter">
<button class="text-on-surface-variant dark:text-surface-variant hover:opacity-80 transition-opacity scale-95 active:transition-transform font-label-md text-label-md flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">add</span>
                    New Conversation
                </button>
<button class="text-on-surface-variant dark:text-surface-variant hover:opacity-80 transition-opacity scale-95 active:transition-transform font-label-md text-label-md flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">person</span>
                    Account
                </button>
</div>
<!-- Mobile Menu Toggle -->
<button class="md:hidden text-on-surface-variant hover:opacity-80 transition-opacity scale-95 active:transition-transform">
<span class="material-symbols-outlined text-[24px]">menu</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-0 py-xl relative overflow-hidden">
<!-- Subtle Background Accent (Decorative) -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary-fixed-dim/10 rounded-full blur-[120px] -z-10 pointer-events-none"></div>
<!-- Centered Conversation Area (760px constraint) -->
<div class="w-full max-w-[760px] flex flex-col items-center text-center mt-[-8vh]">
<!-- Branding & Tagline -->
<div class="space-y-lg mb-xl">
<h1 class="font-display text-display text-primary slide-up">
                    HerBecoming
                </h1>
<div class="space-y-sm slide-up delay-100">
<p class="font-headline-md text-headline-md text-on-surface">
                        Think clearly. Choose consciously. Grow intentionally.
                    </p>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[540px] mx-auto leading-relaxed">
                        A quiet space to think through the questions that matter.
                    </p>
</div>
</div>
<!-- Composer (Input Area) -->
<div class="w-full mt-xl slide-up delay-300">
<div class="relative w-full group composer-focus transition-all duration-300 rounded-2xl bg-surface-container-lowest border border-outline-variant hover:border-outline shadow-sm overflow-hidden flex flex-col">
<textarea aria-label="New journal entry or reflection" class="w-full bg-transparent border-none focus:ring-0 resize-none p-md font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/50 min-h-[120px]" placeholder="What's on your mind?"></textarea>
<!-- Composer Actions Footer -->
<div class="flex items-center justify-between px-md py-sm bg-surface-container-lowest border-t border-surface-container">
<div class="flex items-center gap-sm text-on-surface-variant">
<button aria-label="Add context" class="p-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center group/btn">
<span class="material-symbols-outlined text-[20px] group-hover/btn:text-primary transition-colors">attach_file</span>
</button>
<button aria-label="Voice note" class="p-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center group/btn">
<span class="material-symbols-outlined text-[20px] group-hover/btn:text-primary transition-colors">mic</span>
</button>
</div>
<button class="bg-primary text-on-primary px-6 py-3 rounded-full font-label-md text-label-md hover:bg-on-primary-fixed-variant hover:shadow-md transition-all duration-300 flex items-center gap-2 scale-95 active:scale-90">
                            Reflect
                            <span class="material-symbols-outlined text-[18px]">arrow_upward</span>
</button>
</div>
</div>
<p class="mt-sm font-label-sm text-label-sm text-on-surface-variant/60 text-center fade-in delay-500">
                    Your thoughts are private and encrypted.
                </p>
</div>
</div>
</main>
</body></html>
