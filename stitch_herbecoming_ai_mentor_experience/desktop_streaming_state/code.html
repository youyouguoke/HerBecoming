<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HerBecoming - Streaming State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#f1ede7",
                        "on-primary-fixed": "#33110d",
                        "tertiary-container": "#aa9a93",
                        "primary-fixed": "#ffdad5",
                        "on-primary-container": "#522925",
                        "primary": "#82524c",
                        "on-secondary-fixed-variant": "#6d372c",
                        "surface-container-high": "#ebe8e2",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f7f3ed",
                        "secondary-fixed-dim": "#ffb4a4",
                        "inverse-surface": "#31302d",
                        "on-primary-fixed-variant": "#673b36",
                        "error": "#ba1a1a",
                        "background": "#fdf9f3",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f4f0ea",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#feb1a0",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e6e2dc",
                        "on-secondary-fixed": "#370e06",
                        "surface-bright": "#fdf9f3",
                        "outline": "#847371",
                        "secondary-fixed": "#ffdad3",
                        "outline-variant": "#d6c2bf",
                        "tertiary": "#695c56",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#f6b7af",
                        "tertiary-fixed-dim": "#d4c3bc",
                        "tertiary-fixed": "#f1dfd7",
                        "on-surface-variant": "#514442",
                        "surface-dim": "#dddad4",
                        "on-tertiary-fixed": "#231a15",
                        "on-surface": "#1c1c18",
                        "inverse-primary": "#f6b7af",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#c98f88",
                        "on-background": "#1c1c18",
                        "on-tertiary-fixed-variant": "#50443f",
                        "on-secondary-container": "#794135",
                        "secondary": "#8a4e41",
                        "on-tertiary-container": "#3d322d",
                        "surface": "#fdf9f3",
                        "surface-container-highest": "#e6e2dc",
                        "surface-tint": "#82524c",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "xl": "80px",
                        "sm": "12px",
                        "margin-desktop": "120px",
                        "unit": "8px",
                        "xs": "4px",
                        "margin-mobile": "20px",
                        "gutter": "24px",
                        "lg": "48px"
                    },
                    "fontFamily": {
                        "body-lg": ["DM Sans"],
                        "label-sm": ["DM Sans"],
                        "headline-lg": ["Playfair Display"],
                        "headline-lg-mobile": ["Playfair Display"],

                        "body-md": ["DM Sans"],

                    }
                }
            }
        }

<style>
        .streaming-dot {
            animation: pulse 1.5s infinite ease-in-out;
        }
        .streaming-dot:nth-child(1) { animation-delay: 0s; }
        .streaming-dot:nth-child(2) { animation-delay: 0.3s; }
        .streaming-dot:nth-child(3) { animation-delay: 0.6s; }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        /* Ambient subtle pulse for the background to indicate thinking */
        @keyframes ambientBreath {
            0%, 100% { background-color: #fdf9f3; }
            50% { background-color: #fcf4eb; }
        }
        .thinking-bg {
            animation: ambientBreath 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-background text-on-background h-full flex flex-col font-body-lg thinking-bg">
<!-- TopAppBar from JSON -->
<header class="bg-background text-primary docked full-width top-0 flat no shadows flex justify-between items-center w-full px-margin-desktop py-md max-w-[1140px] mx-auto hidden md:flex z-10 sticky">
<div class="font-headline-md text-headline-md text-primary hover:opacity-80 transition-opacity cursor-pointer">
            HerBecoming
        </div>
<div class="flex items-center gap-gutter">
<button class="font-label-md text-label-md text-on-surface-variant hover:opacity-80 transition-opacity flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">edit_square</span>
                New Conversation
            </button>
<button class="font-label-md text-label-md text-on-surface-variant hover:opacity-80 transition-opacity flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
                Account
            </button>
</div>
</header>
<!-- Main Content Area - Centered Editorial Layout -->
<main class="flex-grow flex flex-col items-center w-full max-w-[1140px] mx-auto px-margin-desktop py-xl relative">
<!-- Conversation Thread -->
<div class="w-full max-w-3xl flex flex-col gap-lg pb-32">
<!-- User Message -->
<div class="w-full flex justify-end">
<div class="max-w-[80%]">
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed text-right">
                        I've been feeling incredibly scattered lately. I have so many goals, but I can't seem to focus on any single one long enough to make progress. Where should I even begin?
                    </p>
</div>
</div>
<!-- Mentor (HerBecoming) Streaming State -->
<div class="w-full flex justify-start relative mt-lg">
<!-- Subtle indicator bar -->
<div class="absolute left-[-24px] top-0 bottom-0 w-[2px] bg-primary-container rounded-full opacity-50"></div>
<div class="max-w-[85%] flex flex-col gap-sm">
<span class="font-headline-md text-headline-md text-primary mb-2">HerBecoming</span>
<div class="flex items-center h-8">
<div class="flex gap-2 items-center">
<div class="w-2 h-2 rounded-full bg-primary streaming-dot"></div>
<div class="w-2 h-2 rounded-full bg-primary streaming-dot"></div>
<div class="w-2 h-2 rounded-full bg-primary streaming-dot"></div>
</div>
<span class="font-label-md text-label-md text-tertiary-container ml-4 tracking-widest uppercase text-xs">Reflecting</span>
</div>
</div>
</div>
</div>
</main>
<!-- Disabled/Interactive Composer anchored to bottom -->
<div class="fixed bottom-0 left-0 w-full bg-gradient-to-t from-background via-background to-transparent pt-xl pb-margin-desktop px-margin-desktop flex justify-center z-20 pointer-events-none">
<div class="w-full max-w-3xl pointer-events-auto">
<div class="relative w-full rounded-lg border-b border-surface-variant bg-surface-container-low transition-all duration-300 opacity-60">
<textarea class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface-variant placeholder:text-tertiary-container resize-none py-md px-md rounded-lg cursor-not-allowed" disabled="" placeholder="HerBecoming is reflecting..." rows="1"></textarea>
<div class="absolute right-4 bottom-4">
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-variant text-tertiary-container cursor-not-allowed transition-colors" disabled="">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_upward</span>
</button>
</div>
</div>
<div class="text-center mt-4">
<span class="font-label-sm text-label-sm text-tertiary-container">HerBecoming is formulating a thoughtful response.</span>
</div>
</div>
</div>
</body></html>
