<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        /* TopAppBar Styles from JSON */
        .top-app-bar {
            @apply flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-md max-w-[1140px] mx-auto bg-background text-primary;
        }
        .top-app-bar-logo {
            @apply font-headline-md text-headline-md text-primary;
        }
    </style>

<body class="min-h-screen flex flex-col font-body-lg">
<!-- Top Navigation Shell -->
<header class="w-full fixed top-0 z-40 top-app-bar transition-transform duration-300">
<div class="top-app-bar-logo tracking-tight">HerBecoming</div>
<nav class="hidden md:flex items-center space-x-gutter">
<!-- Navigation hidden on linear/error pages per shell rules, but we keep the structure for header -->
<!-- Adding a subtle exit point -->
<button class="flex items-center space-x-xs text-on-surface-variant hover:opacity-80 transition-opacity font-label-md text-label-md group">
<span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
<span>Back to Journal</span>
</button>
</nav>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop relative z-10 pt-24 pb-24">
<div class="max-w-[540px] w-full text-center flex flex-col items-center space-y-lg animate-fade-in-up">
<!-- Graphic / Icon Anchor -->
<div class="w-32 h-32 rounded-full bg-surface-container flex items-center justify-center relative overflow-hidden">
<!-- Tonal ripple effect -->
<div class="absolute inset-0 bg-surface-variant opacity-20 rounded-full scale-150 blur-xl"></div>
<span class="material-symbols-outlined text-5xl text-tertiary opacity-80" data-icon="water_drop" style="font-variation-settings: 'FILL' 0, 'wght' 200;">water_drop</span>
</div>
<!-- Copy -->
<div class="space-y-sm">
<h1 class="font-display text-display text-on-surface tracking-tight">
                    Something went wrong.
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[400px] mx-auto opacity-90 leading-relaxed">
                    I couldn’t complete that response. Please try again.
                </p>
</div>
<!-- Actions -->
<div class="pt-4">
<button class="bg-primary text-on-primary font-label-md text-label-md px-10 py-4 rounded-full hover:opacity-90 active:scale-95 transition-all shadow-sm">
                    Try again
                </button>
</div>
</div>
</main>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
    </style>
</body></html>
